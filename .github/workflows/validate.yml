name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seats:
    name: Seats, roster, house rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every Shark seat
        run: python3 scripts/validate.py
      - name: JSON files parse
        run: |
          for f in skills/shark-tank/roster.json .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done

  plugin:
    name: Claude Code plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate .
          claude plugin validate .claude-plugin/marketplace.json
